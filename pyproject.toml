[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent"
version = "3.4.0"
description = "A local-first AI agent for Windows that runs entirely on your own machine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prathmesh Ahire" }]
keywords = ["ai", "agent", "llm", "offline", "local-first", "llama-cpp"]

dependencies = [
    "llama-cpp-python>=0.3.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
rag = ["sentence-transformers>=3.0.0", "faiss-cpu>=1.8.0"]
training = ["transformers>=4.44.0", "peft>=0.12.0", "datasets>=2.20.0", "accelerate>=0.33.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "httpx>=0.27.0"]
all = ["nexus-agent[rag,training]"]

[project.scripts]
nexus = "nexus.ui.desktop:main"

[project.urls]
Repository = "https://github.com/manofculture55/Nexus-Agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
